
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALANCE ARCHITECTURE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f4f0;
      color: #252525;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 32px 6%;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
    }
    .logo { letter-spacing: 5px; font-size: 20px; }
    main { padding: 12vh 8% 15vh; }
    h1 {
      font-size: clamp(42px, 8vw, 100px);
      font-weight: 400;
      letter-spacing: -4px;
      line-height: 1.05;
      max-width: 900px;
    }
    p {
      font-size: 16px;
      line-height: 1.8;
      color: #777;
    }
    footer {
      padding: 30px 6%;
      border-top: 1px solid #ddd;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BALANCE</div>
    <div>ARCHITECTURE</div>
  </header>
  <main>
    <p>ARCHITECTURE · DESIGN · DEVELOPMENT</p>
    <h1>Creating meaningful spaces for a better balance.</h1>
    <p>Welcome to BALANCE ARCHITECTURE.</p>
  </main>
  <footer>BALANCE ARCHITECTURE © 2026</footer>
</body>
</html>
